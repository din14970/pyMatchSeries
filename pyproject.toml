[tool.poetry]
name = "pymatchseries"
version = "0.2.0"
license = "GPL-3.0"
description = "A Python implementation of joint-non-rigid-registration and wrapper of match-series for aligning stacks of deformed images"
authors = [
  "Niels Cautaerts <nielscautaerts@hotmail.com>",
  "Benjamin Berkels <>",
]
readme = "README.md"
repository = "https://github.com/din14970/pyMatchSeries"
keywords = ["TEM", "alignment", "image processing"]
classifiers = [
  "Topic :: Scientific/Engineering :: Physics",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
]

[tool.poetry.dependencies]
python = "~3.10"
numba = "^0.58.0"
hyperspy = "^1.7"
pydantic = "^2.4.0"

[tool.poetry.group.gpu.dependencies]
cupy-cuda11x = "^11.6.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.0.238"
ipykernel = "^6.21.0"
mypy = "^0.991"
mypy-extensions = "^0.4.2"
pre-commit = "^3.0.2"
black = "^22.12.0"
conda-lock = "^1.0.5"
isort = "^5.12.0"
ipympl = "^0.9.3"

[tool.poetry.group.test.dependencies]
pytest = "^7.2.2"
pytest-cov = "^4.0.0"
pytest-skip-slow = "^0.0.5"

[tool.poetry.group.lsp]
optional = true

[tool.poetry.group.lsp.dependencies]
pynvim = "^0.4.3"
python-lsp-server = "^1.7.1"
pylsp-mypy = "^0.6.5"
python-lsp-ruff = "^1.0.5"
python-lsp-black = "^1.2.1"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^6.1.3"
sphinx-autoapi = "^2.0.1"
sphinx-autodoc-typehints = "^1.22"
m2r2 = "^0.3.3.post2"
numpydoc = "^1.5.0"
furo = "^2022.12.7"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 88
target-version = ['py310']
include = '\.pyi?$'

[tool.isort]
profile = "black"
skip_gitignore = true

[tool.mypy]
plugins = [
  "pydantic.mypy"
]

follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra --import-mode=importlib"
testpaths = [
    "tests",
]
xfail_strict = true

[coverage.run]
source = "pymatchseries"
include = "*/pymatchseries/*"
relative_files = true

[coverage.report]
precision=2
